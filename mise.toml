[settings]
dotfiles.default_mode = "symlink"
env_shell_expand = true

[dotfiles]
"~/.config/bundle" = "bundle"
"~/.config/fish" = "fish"
"~/.config/git" = "git"
"~/.config/herdr" = "herdr"
"~/.config/mise" = "mise"
"~/.config/nvim" = "nvim"
"~/.config/psql" = "psql"
"~/.config/ripgrep" = "ripgrep"
"~/.local/bin" = { source = "bin", mode = "symlink-each" }

[tasks.herdr-plugins]
description = "Install Herdr plugins"
run = [
    "herdr plugin install lmilojevicc/herdr-splits.nvim --yes",
    "herdr plugin install persiyanov/herdr-reviewr --yes",
]
